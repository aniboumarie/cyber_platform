{% extends 'base.html' %}

{% block title %}Create New User{% endblock %}

{% block content %}
<h2>Create New User</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">Create User</button>
    <a href="{% url 'manage_users' %}" class="btn btn-secondary">Back to Manage Users</a>
</form>
{% endblock %}
