<h2>Register</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <label for="role">Select Role:</label>
  <select name="role" required>
    <option value="Admin">Admin</option>
    <option value="Trainer">Trainer</option>
    <option value="Trainee">Trainee</option>
  </select>
  <button type="submit">Register</button>
</form>
