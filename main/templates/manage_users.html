{% extends 'base.html' %}

{% block title %}Manage Users{% endblock %}

{% block content %}
<h2>Manage User Roles</h2>
<form method="post">
    {% csrf_token %}
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Username</th>
                <th>Current Role</th>
            </tr>
        </thead>
        <tbody>
            {% for user, form in forms %}
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ form.group }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <button type="submit" class="btn btn-primary">Update Roles</button>
</form>
{% endblock %}
